name: Site Check

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-check:
    name: Metadata, privacy and asset guard
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Pillow
        run: python3 -m pip install --quiet pillow

      - name: Run site checks
        run: python3 tools/check-site.py
